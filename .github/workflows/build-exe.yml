# Builds FilamentForge.exe on Windows.
# - Every push to main (and every pull request): the exe is attached to the workflow run
#   (Actions tab → run → Artifacts).
# - Push a tag like v1.2.0: also publishes a GitHub Release with the exe to download.
name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest httpx

      - name: Tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm packaging/FilamentForge.spec

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:FORGE_DATA_DIR = "$env:RUNNER_TEMP\ff-data"
          $p = Start-Process -FilePath dist\FilamentForge.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 15
          $meta = Invoke-RestMethod http://127.0.0.1:8765/api/meta
          Write-Host "data dir: $($meta.data_dir)"
          (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: FilamentForge-windows
          path: dist/FilamentForge.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FilamentForge.exe
          generate_release_notes: true
